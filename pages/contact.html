<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Контактна форма навчального HTML-сайту."
  >
  <title>Контакти</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">YL</a>

      <nav aria-label="Головна навігація">
        <a href="../index.html">Головна</a>
        <a href="about.html">Про мене</a>
        <a class="active" href="contact.html">Контакти</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="kicker">Контакти</p>
        <h1>Зв’яжіться зі мною</h1>

        <p>
          Заповніть форму, якщо хочете залишити повідомлення
          або запропонувати співпрацю.
        </p>
      </div>
    </section>

    <section class="card">
      <form action="#" method="get">
        <h2>Форма зворотного зв’язку</h2>

        <div class="form-group">
          <label for="name">Ім’я *</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            minlength="2"
            maxlength="30"
          >
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            id="email"
            name="email"
            type="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            pattern="[0-9+() -]{7,20}"
            placeholder="+43 123 456 789"
          >
        </div>

        <div class="form-group">
          <label for="topic">Тема звернення</label>

          <select id="topic" name="topic">
            <option value="study">Навчання</option>
            <option value="work">Співпраця</option>
            <option value="other">Інше</option>
          </select>
        </div>

        <fieldset>
          <legend>Зручний спосіб зв’язку</legend>

          <label class="option">
            <input
              type="radio"
              name="contactWay"
              value="email"
              checked
            >
            Email
          </label>

          <label class="option">
            <input
              type="radio"
              name="contactWay"
              value="phone"
            >
            Телефон
          </label>
        </fieldset>

        <div class="form-group">
          <label for="message">Повідомлення *</label>

          <textarea
            id="message"
            name="message"
            rows="6"
            required
            minlength="10"
            maxlength="500"
          ></textarea>
        </div>

        <div class="form-group">
          <label class="option">
            <input
              type="checkbox"
              name="agree"
              required
            >
            Погоджуюсь із правилами *
          </label>
        </div>

        <button type="submit">Надіслати</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Юліана Лук’янова</p>
  </footer>
</body>
</html>
