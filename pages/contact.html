<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Контактна форма навчального HTML-сайту."
  >
  <title>Контакти</title>

  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/responsive.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../index.html">YL</a>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="main-nav"
      >
        Меню
      </button>

      <nav id="main-nav" aria-label="Головна навігація">
        <a href="../index.html">Головна</a>
        <a href="about.html">Про мене</a>
        <a href="catalog.html">Каталог</a>
        <a href="contact.html">Контакти</a>
        <button class="theme-toggle" type="button">Темна тема</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="kicker">Контакти</p>
        <h1>Зв’яжіться зі мною</h1>

        <p>
          Заповніть форму, якщо хочете залишити повідомлення
          або запропонувати співпрацю.
        </p>
      </div>
    </section>

    <section class="card">
      <form id="contact-form" action="#" method="get" novalidate>
        <h2>Форма зворотного зв’язку</h2>

        <div class="form-group">
          <label for="name">Ім’я *</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            minlength="2"
            maxlength="30"
          >
          <small class="field-error" id="name-error"></small>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            id="email"
            name="email"
            type="email"
            required
          >
          <small class="field-error" id="email-error"></small>
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            pattern="[0-9+() -]{7,20}"
            placeholder="+43 123 456 789"
          >
        </div>

        <div class="form-group">
          <label for="topic">Тема звернення</label>

          <select id="topic" name="topic">
            <option value="study">Навчання</option>
            <option value="work">Співпраця</option>
            <option value="other">Інше</option>
          </select>
        </div>

        <fieldset>
          <legend>Зручний спосіб зв’язку</legend>

          <label class="option">
            <input
              type="radio"
              name="contactWay"
              value="email"
              checked
            >
            Email
          </label>

          <label class="option">
            <input
              type="radio"
              name="contactWay"
              value="phone"
            >
            Телефон
          </label>
        </fieldset>

        <div class="form-group">
          <label for="message">Повідомлення *</label>

          <textarea
            id="message"
            name="message"
            rows="6"
            required
            minlength="10"
            maxlength="500"
          ></textarea>
          <small class="field-error" id="message-error"></small>
          <small class="character-counter" id="message-counter">0 / 500</small>
        </div>

        <div class="form-group">
          <label class="option">
            <input
              type="checkbox"
              name="agree"
              required
            >
            Погоджуюсь із правилами *
          </label>
          <small class="field-error" id="agree-error"></small>
        </div>

        <button type="submit">Надіслати</button>
      </form>
      <div class="form-success" id="form-success" hidden></div>
    </section>
  </main>

  <footer>
    <p>&copy; <span class="current-year"></span> Юліана Лук’янова</p>
  </footer>

  <button class="back-to-top" type="button" hidden>↑ Вгору</button>

<script src="../js/main.js" defer></script>
</body>
</html>
